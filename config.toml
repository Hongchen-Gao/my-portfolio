baseURL = "https://hongchen-gao.github.io/my-portfolio/"
languageCode = "en-us"
title = "Hongchen Gao"
theme = "PaperMod"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Hongchen Gao"
  ShowReadingTime = false
  defaultTheme = "light"
  disableSpecial1stPost = true
  hideSummary = true
  mainSections = ["projects", "posts"]
  DateFormat = "January 2, 2006"

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  responsive = true
  linkFullImages = true

[params.profileMode]
  enabled = true
  title = "Hongchen Gao"
  subtitle = "Visual artist and educator"
  imageUrl = "images/photo.jpg"
  imageTitle = "Profile Photo"
  imageWidth = 150
  imageHeight = 150
  imageShape = "circle"

[params.homeInfoParams]
  Title = "Hongchen Gao"
  Content = "Welcome to my portfolio website. I'm a visual artist and educator."

[[params.socialIcons]]
  name = "email"
  url = "mailto:hongchengaoart@gmail.com"

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "Artistic Creations"
  url = "/artistic-creations/"
  weight = 10

[[menu.main]]
  name = "Education and Curatorial Projects"
  url = "/categories/education-and-curatorial-projects/"
  weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
